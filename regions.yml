# Regions built every month (RideX ARCHITECTURE §9.9). `area` is the Geofabrik extract Planetiler
# downloads; `geofabrik` is its path on download.geofabrik.de, used to read the OSM data date.
# `bbox` is [minLon, minLat, maxLon, maxLat], used by the app to pick the region for the map view.
regions:
  - id: portugal
    name: Portugal
    area: portugal
    geofabrik: europe/portugal
    bbox: [-31.6, 29.8, -6.1, 42.2]
  - id: spain
    name: Spain
    area: spain
    geofabrik: europe/spain
    bbox: [-18.5, 27.4, 4.6, 44.0]
  # Island regions: also inside portugal/spain, but a much smaller download for island riders.
  # Geofabrik has no separate Madeira or Balearic Islands extract.
  - id: azores
    name: Azores
    area: azores
    geofabrik: europe/azores
    bbox: [-31.6, 36.7, -24.6, 40.1]
  - id: canary-islands
    name: Canary Islands
    area: canary-islands
    geofabrik: africa/canary-islands
    bbox: [-18.5, 27.4, -13.2, 29.6]
  - id: andorra
    name: Andorra
    area: andorra
    geofabrik: europe/andorra
    bbox: [1.4, 42.4, 1.8, 42.7]
  - id: morocco
    name: Morocco
    area: morocco
    geofabrik: africa/morocco
    bbox: [-17.3, 20.7, -0.9, 36.0]
  - id: italy
    name: Italy
    area: italy
    geofabrik: europe/italy
    bbox: [6.6, 35.3, 18.6, 47.1]
  - id: great-britain
    name: Great Britain
    area: great-britain
    geofabrik: europe/great-britain
    bbox: [-8.7, 49.8, 1.8, 60.9]
  - id: ireland
    name: Ireland and Northern Ireland
    area: ireland-and-northern-ireland
    geofabrik: europe/ireland-and-northern-ireland
    bbox: [-10.7, 51.3, -5.4, 55.5]
  - id: netherlands
    name: Netherlands
    area: netherlands
    geofabrik: europe/netherlands
    bbox: [3.2, 50.7, 7.3, 53.6]
  - id: belgium
    name: Belgium
    area: belgium
    geofabrik: europe/belgium
    bbox: [2.5, 49.4, 6.4, 51.6]
  - id: switzerland
    name: Switzerland
    area: switzerland
    geofabrik: europe/switzerland
    bbox: [5.9, 45.8, 10.5, 47.9]
  - id: austria
    name: Austria
    area: austria
    geofabrik: europe/austria
    bbox: [9.5, 46.3, 17.2, 49.1]
