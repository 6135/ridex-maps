# Monthly build of the RideX offline region maps (RideX ARCHITECTURE §9.9): Geofabrik extract →
# Planetiler (OpenMapTiles profile, the schema OpenFreeMap uses) → .pmtiles + catalog.json →
# release maps-YYYY-MM. The app reads releases/latest/download/catalog.json.
name: Build regions

on:
  schedule:
    - cron: "0 3 5 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-regions
  cancel-in-progress: false

env:
  PLANETILER_VERSION: "0.10.2"

jobs:
  regions:
    runs-on: ubuntu-latest
    outputs:
      ids: ${{ steps.list.outputs.ids }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: echo "ids=$(python3 -c 'import yaml,json;print(json.dumps([r["id"] for r in yaml.safe_load(open("regions.yml"))["regions"]]))')" >> "$GITHUB_OUTPUT"

  build:
    needs: regions
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        region: ${{ fromJson(needs.regions.outputs.ids) }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Region settings
        id: region
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import yaml
          r = next(r for r in yaml.safe_load(open("regions.yml"))["regions"] if r["id"] == "${{ matrix.region }}")
          print(f"area={r['area']}")
          print(f"geofabrik={r['geofabrik']}")
          EOF

      # Natural Earth, water polygons and lake centrelines change rarely: cached between runs.
      - uses: actions/cache@v4
        with:
          path: data/sources
          key: planetiler-sources-v1-${{ github.run_id }}
          restore-keys: planetiler-sources-v1-

      - name: Planetiler
        run: |
          curl -fsSL -o planetiler.jar "https://github.com/onthegomap/planetiler/releases/download/v${PLANETILER_VERSION}/planetiler.jar"
          rm -f data/sources/*.osm.pbf
          java -Xmx10g -jar planetiler.jar --download --area=${{ steps.region.outputs.area }} \
            --output=dist/${{ matrix.region }}.pmtiles --maxzoom=14 --storage=mmap --nodemap-type=array \
            --force
          rm -f data/sources/*.osm.pbf

      - name: OSM data date
        run: |
          ts=$(curl -fsSL "https://download.geofabrik.de/${{ steps.region.outputs.geofabrik }}-updates/state.txt" | sed -n 's/^timestamp=//p' | cut -c1-10)
          echo "$ts" > dist/${{ matrix.region }}.osmdate
          ls -l dist; cat dist/${{ matrix.region }}.osmdate

      - uses: actions/upload-artifact@v4
        with:
          name: region-${{ matrix.region }}
          path: dist/
          retention-days: 3
          compression-level: 0

  publish:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: region-*
          path: dist
          merge-multiple: true

      - name: Catalog
        id: catalog
        run: |
          tag="maps-$(date -u +%Y-%m)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          python3 scripts/catalog.py regions.yml dist "$tag" "${{ github.repository }}"
          ls -l dist

      # Files over GitHub's 2 GiB asset limit would fail here; such regions get split (§9.9 step 5).
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.catalog.outputs.tag }}
        run: |
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" dist/*.pmtiles dist/catalog.json --latest \
            --title "Maps $TAG" --notes "OpenStreetMap data © OpenStreetMap contributors (ODbL). Tiles built with Planetiler (OpenMapTiles schema)."

      - name: Keep the last 2 releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 100 --json tagName,createdAt -q 'sort_by(.createdAt) | reverse | .[2:][] | .tagName' |
            while read -r old; do gh release delete "$old" --yes --cleanup-tag; done
